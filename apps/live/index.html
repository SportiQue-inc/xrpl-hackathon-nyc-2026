<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentRail live</title>
<link rel="stylesheet" href="/apps/demo/demo.css">
<style>
  body { background: var(--bg); }
  .pad { padding: 40px; }
  .live header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 3; }
  .live header .logo { color: var(--brand); font-size: 18px; }
  .live header a { color: var(--brand); text-decoration: none; font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 18px; padding: 18px 24px; align-items: start; }
  .left { gap: 18px; }
  .node { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
  .node.inst { background: var(--brand-weak); border-color: var(--brand-line); }
  .edge { font-size: 11px; color: var(--text-3); padding-left: 14px; border-left: 2px solid var(--brand-line); margin-left: 14px; }
  .subform { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 10px; }
  .subform input { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; width: 100%; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; }
  .hm { display: grid; gap: 2px; font-size: 10px; align-items: center; max-height: 420px; overflow-y: auto; }
  .hm .hd { text-align: center; color: var(--text-2); } .hm .pid { color: var(--text-2); }
  .hm i, .legend i { display: inline-block; height: 9px; border-radius: 2px; background: var(--gray-bg); }
  .legend i { width: 14px; margin-right: 4px; vertical-align: middle; } .legend { gap: 14px; }
  i.ok { background: #34d399; } i.held { background: #bfdbfe; } i.wait { background: var(--gray-bg); border: 1px dashed #cbd5e1; } i.gap { background: #fff; border: 1.5px solid var(--red); }
  .log { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 100px); }
  .log .rows { overflow-y: auto; }
  .lrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .lrow .t { color: var(--text-3); width: 64px; flex: none; }
  .lrow a { color: var(--brand); text-decoration: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/apps/live/live.js"></script>
</body>
</html>
