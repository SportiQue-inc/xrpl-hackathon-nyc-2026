<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Vault Market</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"><link rel="stylesheet" href="/static/ui.css"></head><body>
<div class="top"><span class="brand">Data Vault Market</span><nav><a href="/" aria-current="page">Market</a><a href="/vault">My DB</a></nav><span class="tag" id="ledgerTag"></span><span id="modelTag" hidden></span><span class="small" id="accountName"></span></div>
<div class="banner" id="banner" hidden></div>
<div class="top filters"><div class="seg" role="group" aria-label="Data category" id="domTabs"></div></div>
<main class="app market-app">
<section class="col side left"><header><div><h1>Sell your data</h1><p class="muted small">Offers that fit your records and terms</p></div></header><div class="scroll" id="sellnow"></div></section>
<section class="col activity"><header><div><h1>Market activity</h1><p class="muted small">Individual negotiations and verified settlements</p></div><span class="tag">Live</span></header><div class="scroll" id="ledger"></div></section>
<section class="col side right"><header><h1>Your agent</h1><button id="agentBtn" type="button" aria-expanded="false">Settings</button></header><div class="scroll"><div id="agents" class="pop" hidden></div><section id="agentQueue" aria-live="polite"></section><div class="chatbox" id="chat" data-open="1"></div><details class="history"><summary>Your completed trades</summary><div id="mine"></div></details></div></section>
</main><dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script src="/static/common.js"></script><script>
let DOMAIN=null, DATA=null, ACC=null, refreshing=false;
const stateLabel = (s) => ({queued:'Queued',waiting:'Waiting for a buyer',negotiating:'Negotiating',settling:'Settling on ledger',settled:'Settled',rejected:'Not sold',blocked:'Blocked by your terms',interrupted:'Recovery pending','recovery review':'Needs review','awaiting buyer':'Waiting for buyer approval'}[s] || s);
function tradeRow(c, own=false) {
  const sold=c.status==='settled', who=own ? (c.buyer===ME?'Bought':'Sold') : c.buyer_name;
  const label=sold ? who : own?'Sale attempt':who;
  const other=sold ? (c.sellers.length>1?`${c.sellers.length} earlier seller payouts`:(c.seller_name||'One seller')) : stateLabel(c.status);
  return `<article class="tx ${sold?'settled':''}"><button type="button" data-c="${c.id}"><time>${hhmm(c.created)}</time><div><b>${esc(label)}${own?'':` → ${esc(other)}`}</b><div class="what">${esc(META.kinds[c.kind].label)} · #${c.id}${!sold?` · ${esc(c.reason||stateLabel(c.status))}`:''}</div></div><span class="amt ${sold?'success':''}">${sold?micro(c.drops,c.asset):esc(stateLabel(c.status))}</span></button></article>`;
}
async function refresh() {
  if (refreshing || !META) return;
  refreshing=true;
  try {
    [DATA,ACC,META]=await Promise.all([api(`/api/market?account=${ME||''}${DOMAIN?'&domain='+DOMAIN:''}`),ME?api(`/api/account/${ME}`):Promise.resolve(null),api('/api/meta')]);
    $('domTabs').innerHTML=[['','All data'],...DATA.domains.map(d=>[d.kind,d.label])].map(([k,l])=>`<button data-k="${k}" aria-pressed="${(DOMAIN||'')===k}">${esc(l)}</button>`).join('');
    $('domTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{DOMAIN=b.dataset.k||null;refresh();});
    $('agentBtn').disabled=!ME;
    $('sellnow').innerHTML=!ME?`<div class="empty"><h2>Your own vault</h2><p>Sign in to see offers for your data and instruct your agent.</p><button class="primary" id="sellSignIn">Sign in to sell</button></div>`:DATA.sell_now.map(p=>`<article class="card offer"><div class="row"><h3>${esc(META.kinds[p.kind].label)}</h3><strong class="price">${xrp(p.expected)}</strong></div><p class="muted small">${esc(p.buyer_name)} · ${esc(p.purpose)}</p><div class="offer-facts"><span>Your minimum <b>${xrp(p.floor)}</b></span><span>Buyer budget <b>${xrp(p.max)}</b></span><span>${p.listed+p.private} available files</span></div><button class="${p.interested?'':'primary'}" data-sell="${p.id}">${p.interested?'View / retry request':'Ask agent to sell'}</button></article>`).join('')||`<div class="empty"><h3>No matching offers yet</h3><p>Upload records in My DB. Your agent will check new requests against your minimum and permitted purposes.</p><a href="/vault">Open My DB →</a></div>`;
    $('sellSignIn')?.addEventListener('click',authDlg);
    $('sellnow').querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>queueSale(+b.dataset.sell));
    $('ledger').innerHTML=DATA.contracts.map(c=>tradeRow(c)).join('')||'<div class="empty">The first negotiation will appear here.</div>';
    const qs=ACC?.agent_queue||[];
    $('agentQueue').innerHTML=ME?`<div class="queue-title"><h2>Requests & history</h2><span class="small muted">${qs.filter(q=>!['settled','rejected','blocked'].includes(q.contract_status||q.status)).length} active</span></div>`+qs.map(q=>{const st=q.contract_status||q.status;return `<article class="queue-item ${st==='settled'?'done':''}"><div class="row"><b>${esc(META.kinds[q.kind].label)}</b><span class="tag ${st==='settled'?'green':''}">${esc(stateLabel(st))}</span></div><p class="small muted">${esc(q.contract_reason||q.reason||'Your instruction is saved.')}</p><div class="row small"><time>R${q.id} · ${hhmm(q.created)}</time>${q.contract?`<button data-c="${q.contract}">C${q.contract} →</button>`:''}</div></article>`;}).join('')+(qs.length?'':'<p class="small muted">No instructions yet. Choose an offer or tell your agent what to sell.</p>'):'';
    $('mine').innerHTML=DATA.contracts.filter(c=>c.mine&&c.status==='settled').map(c=>tradeRow(c,true)).join('')||'<p class="small muted">No completed trades yet.</p>';
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openContract(+b.dataset.c).catch(showError));
    chatBox($('chat'),ACC||{chat:[]});renderAgents();
  } catch(err) {showError(err);} finally {refreshing=false;}
}
$('agentBtn').onclick=()=>{if(!canAct())return;$('agents').hidden=!$('agents').hidden;$('agentBtn').setAttribute('aria-expanded',String(!$('agents').hidden));};
function renderAgents() {
  if (!ACC) return;
  if (document.activeElement && $("agents").contains(document.activeElement)) return;   // don't redraw under the cursor
  const a = ACC.account, s = a.sell_agent, b = a.buy_agent;
  $("agents").innerHTML = `<div class="card"><h3>Sell agent</h3>
    <label class="small" for="mode">Before selling</label><select id="mode"><option value="ask" ${s.mode === "ask" ? "selected" : ""}>Ask me first (or when I mark interest)</option><option value="auto" ${s.mode === "auto" ? "selected" : ""}>Sell on its own within my rules</option></select>
    <span class="small muted">Minimum price per person</span>
    ${Object.entries(META.kinds).map(([k, v]) => `<div class="row small"><label for="min-${k}">${esc(v.label)}</label><input type="number" step="0.5" id="min-${k}" value="${s.min?.[k] ?? v.price}"></div>`).join("")}
    <label class="small" for="blocks">Never sell for (comma separated)</label><input type="text" id="blocks" value="${esc((s.blocks || []).join(", "))}"></div>
    <div class="card"><h3>Buy agent</h3>
    <div class="row small"><label for="limit">Buys on its own up to</label><input type="number" id="limit" value="${b.auto_limit}"></div>
    <div class="row small"><label for="trust">Minimum seller trust</label><input type="number" step="0.05" id="trust" value="${b.min_trust}"></div>
    <div class="row small"><label for="overlap">Refuse lots overlapping my data by</label><input type="number" step="0.05" id="overlap" value="${b.max_overlap}"></div></div>
    <button class="primary" type="button" id="save">Save agent settings</button><span class="small muted" id="saved"></span>`;
  $("save").onclick = async () => {
    if (!canAct()) return;
    const min = {}; Object.keys(META.kinds).forEach((k) => (min[k] = +$("min-" + k).value));
    await post(`/api/account/${ME}/settings`, { sell_agent: { mode: $("mode").value, min, blocks: $("blocks").value.split(",").map((x) => x.trim()).filter(Boolean) },
      buy_agent: { auto_limit: +$("limit").value, min_trust: +$("trust").value, max_overlap: +$("overlap").value } });
    $("saved").textContent = "Saved. Your agents use these from the next negotiation.";
  };
}

async function openContract(id) {
  const d=await api(`/api/contract/${id}`), c=d.contract, t=c.trace||{}, asset=c.asset||'XRP';
  const finishes=d.txs.filter(x=>x.type.startsWith('EscrowFinish')&&x.result==='tesSUCCESS');
  const total=finishes.reduce((sum,x)=>sum+(x.drops||0),0);
  const model=[...new Set(d.messages.map(m=>m.by).filter(x=>x&&x!=='rules'))];
  const price=(units)=>micro(units*(c.unit_micro||10000),asset);
  $('dlgBody').innerHTML=`<header class="contract-head"><div><span class="eyebrow">${esc(c.reference||`C${c.id}`)} · ${esc(META.kinds[c.kind].label)}</span><h1>${esc(c.buyer_name)} · ${c.sellers.length>1?'Earlier bundled purchase':'One-to-one negotiation'}</h1><p class="muted small">${esc(d.posting?.purpose||'')}</p><code class="small muted">${esc(c.ledger_memo||`vaultmarket/contract/${c.id}`)}</code></div><button id="close" aria-label="Close contract">Close</button></header>
  <div class="settlement-summary"><span class="tag ${c.status==='settled'?'green':''}">${esc(stateLabel(c.status))}</span><strong class="${c.status==='settled'?'success':''}">${total?micro(total,asset):'No verified payout'}</strong><span class="small muted">${finishes.length} verified payout${finishes.length===1?'':'s'} · ${model.length?esc(model.join(', ')):'Rule-based negotiation'}</span></div>
  ${c.status!=='settled'?`<p class="notice">${esc(c.reason||stateLabel(c.status))}</p>`:''}
  ${c.unit_micro!==1000000?`<p class="small muted">Original log uses price units: 1 unit = ${micro(c.unit_micro||10000,asset)}. Verified payouts below use the actual asset amount.</p>`:''}
  ${c.sellers.length>1?'<p class="small muted">This historical contract grouped several sellers. New contracts negotiate and settle with one seller at a time.</p>':''}
  <section class="conversation"><h2>Negotiation</h2><div class="talk">${d.messages.map(m=>`<article class="say ${m.side}"><span class="who">${esc(m.name)} · ${m.side==='buyer'?'Buyer':'Seller'} · ${m.by&&m.by!=='rules'?esc(m.by):'Rules'}</span><div class="bubble">${esc(m.text)}</div>${m.thinking?`<details><summary>Reason</summary><p>${esc(m.thinking)}</p></details>`:''}</article>`).join('')||'<p class="small muted">No negotiation messages were stored.</p>'}</div></section>
  <details class="audit"><summary>Decision details</summary><p class="small muted">Buyer opening ${price(d.posting?.offer||0)} · maximum ${price(d.posting?.max||0)}</p><ol>${(t.buyer_trace||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${(t.seller_trace||[]).map(x=>`<p class="small">${esc(d.messages.find(m=>m.speaker===x.seller)?.name||x.seller)} · ${x.verdict==='agree'?'Accepted terms':x.verdict==='decline'?'No sale: price or purpose did not fit':esc(x.verdict)}${x.price?` · asked ${price(x.price)}`:''}</p>`).join('')}</details>
  <details class="audit" ${c.status==='interrupted'||c.status==='recovery review'?'open':''}><summary>Ledger receipts & delivery checks</summary><p class="small muted">Amounts below are the gross transfer. Network fees are separate.</p>${d.txs.map(x=>`<div class="receipt"><div><b>${esc(x.reference)} · ${esc(x.type)}</b><p class="small muted">${esc(x.src_name)} → ${esc(x.dst_name)} · ${esc(x.result)}</p></div><span class="${x.type.startsWith('EscrowFinish')&&x.result==='tesSUCCESS'?'success':''}">${x.receipt?.gross_amount!=null?amount(x.receipt.gross_amount,x.asset||asset):micro(x.drops,x.asset||asset)}</span>${x.receipt?`<p class="small muted">Ledger ${x.receipt.ledger_index||"pending"} · ${x.receipt.validated?"validated":"unverified"} · network fee ${x.receipt.fee_xrp} XRP</p>`:""}${x.url?`<a class="small mono" href="${x.url}" target="_blank" rel="noopener">${esc(x.hash)} ↗</a>`:''}</div>`).join('')}${(t.protocol||[]).map(x=>`<p class="small"><b>${esc(x.protocol)}</b> · ${x.ok?'Verified':'Not verified'}<br><span class="muted">${esc(x.detail)}</span></p>`).join('')}</details>`;
  $('close').onclick=()=>$('dlg').close();if(!$('dlg').open)$('dlg').showModal();
}
topbar('market').then(refresh).catch(showError);live();
</script></body></html>
