<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Vault Market</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"><link rel="stylesheet" href="/static/ui.css"></head><body>
<div class="top"><span class="brand">Data Vault Market</span><span class="small" id="accountName">Loading vault…</span><nav aria-label="Main navigation"><a href="https://agentrail-try-production.up.railway.app/apps/try/index.html">Home</a><a href="/">Market</a><a href="/vault">My DB</a><a href="/assets">Assets</a><a href="/demo">Demo</a><a href="/report">Report</a></nav><span class="tag" id="ledgerTag"></span><span id="modelTag" hidden></span></div>
<div class="banner" id="banner" hidden></div>
<div class="top filters"><div class="seg" role="group" aria-label="Data category" id="domTabs"></div></div>
<main class="app market-app">
<section class="col side left"><header><div><h1>Sell your data</h1><p class="muted small">Offers that fit your records and terms</p></div></header><div class="scroll" id="sellnow"></div></section>
<section class="col activity"><header><div><h1>Market activity</h1><p class="muted small">Individual negotiations and verified settlements</p></div><span class="tag">Live</span></header><div class="scroll" id="ledger"></div></section>
<section class="col side right"><header><h1>Your agent</h1><button id="agentBtn" type="button" aria-expanded="false">Settings</button></header><div class="scroll"><div id="agents" class="pop" hidden></div><section id="agentQueue" aria-live="polite"></section><div class="chatbox" id="chat" data-open="1"></div><details class="history"><summary>Your trade history</summary><div id="mine"></div></details></div></section>
</main><dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script src="/static/common.js"></script><script>
let DOMAIN=null, DATA=null, ACC=null, refreshing=false, firstFeed=true, currentContract=null, detailBusy=false;
const seenTrades=new Map(), recentTrades=new Map();
const stateLabel = (s) => ({refunded:'Escrow returned to buyer',queued:'Queued',waiting:'Waiting for a buyer',negotiating:'Negotiating',settling:'Settling on ledger',settled:'Settled',rejected:'Not sold',blocked:'Blocked by your terms',interrupted:'Recovery pending','recovery review':'Needs review','awaiting buyer':'Waiting for buyer approval'}[s] || s);
function tradeRow(c, own=false) {
  const sold=c.status==='settled', overview=typeof c.overview==='string'?JSON.parse(c.overview||'null'):c.overview;
  return `<article class="tx ${sold?'settled':''} ${(recentTrades.get(c.id)||0)>Date.now()?'trade-new':''}"><button type="button" data-c="${c.id}"><div class="trade-data"><b>${esc(META.kinds[c.kind].label)}</b><div class="what">C${c.id} · ${hhmm(c.created)}${c.items?` · ${c.items} file${c.items===1?'':'s'}`:''}${overview?.records?` · ${overview.records} records`:''}${!sold?` · ${esc(c.reason||stateLabel(c.status))}`:''}</div></div><span class="amt ${sold?'success':['rejected','blocked'].includes(c.status)?'failure':'pending'}">${sold?micro(c.drops,c.asset):esc(stateLabel(c.status))}</span></button></article>`;
}
async function refresh() {
  if (refreshing || !META) return;
  refreshing=true;
  try {
    [DATA,ACC,META]=await Promise.all([api(`/api/market?account=${ME||''}${DOMAIN?'&domain='+DOMAIN:''}`),ME?api(`/api/account/${ME}`):Promise.resolve(null),api('/api/meta')]);
    $('domTabs').innerHTML=[['','All data'],...DATA.domains.map(d=>[d.kind,d.label])].map(([k,l])=>`<button data-k="${k}" aria-pressed="${(DOMAIN||'')===k}">${esc(l)}</button>`).join('');
    $('domTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{DOMAIN=b.dataset.k||null;refresh();});
    if(ACC)memberBalance(ACC);
    $('agentBtn').disabled=!ME;
    $('sellnow').innerHTML=!ME?`<div class="empty"><h2>Your own vault</h2><p>Sign in to see offers for your data and instruct your agent.</p><button class="primary" id="sellSignIn">Sign in to sell</button></div>`:DATA.sell_now.map(p=>`<article class="card offer"><div class="row"><h3>${esc(META.kinds[p.kind].label)}</h3><strong class="price">${xrp(p.expected)}</strong></div><p class="muted small">${esc(p.buyer_name)} · ${esc(p.purpose)}</p><div class="offer-facts"><span>Your minimum <b>${xrp(p.floor)}</b></span><span>Buyer budget <b>${xrp(p.max)}</b></span><span>${p.listed+p.private} available files</span></div><button class="${p.interested?'':'primary'}" data-sell="${p.id}">${p.interested?'View / retry request':'Ask agent to sell'}</button></article>`).join('')||`<div class="empty"><h3>No matching offers yet</h3><p>Upload records in My DB. Your agent will check new requests against your minimum and permitted purposes.</p><a href="/vault">Open My DB →</a></div>`;
    $('sellSignIn')?.addEventListener('click',authDlg);
    $('sellnow').querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>queueSale(+b.dataset.sell));
    for(const c of DATA.contracts){if(!firstFeed&&seenTrades.get(c.id)!==c.status)recentTrades.set(c.id,Date.now()+5000);seenTrades.set(c.id,c.status);}firstFeed=false;
    const active=DATA.contracts.filter(c=>['negotiating','settling','awaiting buyer'].includes(c.status)),history=DATA.contracts.filter(c=>!active.includes(c));
    $('ledger').innerHTML=`<section class="live-sessions"><h2>In progress · ${active.length}</h2><p class="small muted">One negotiation at a time. Messages update while the agents work.</p>${active.map(c=>tradeRow(c)).join('')||'<p class="small muted">Waiting for the next negotiation.</p>'}</section><h2 class="history-heading">Recent outcomes</h2>${history.map(c=>tradeRow(c)).join('')||'<div class="empty">The first outcome will appear here.</div>'}`;
    const qs=ACC?.agent_queue||[];
    $('agentQueue').innerHTML=ME?`<div class="queue-title"><h2>Requests & history</h2><span class="small muted">${qs.filter(q=>!['settled','rejected','blocked','refunded'].includes(q.contract_status||q.status)).length} active</span></div>`+qs.map(q=>{const st=q.contract_status||q.status;return `<article class="queue-item ${st==='settled'?'done':''}"><div class="row"><b>${esc(META.kinds[q.kind].label)}</b><span class="tag ${st==='settled'?'green':''}">${esc(stateLabel(st))}</span></div><p class="small muted">${esc(q.contract_reason||q.reason||'Your instruction is saved.')}</p><div class="row small"><time>R${q.id} · ${hhmm(q.created)}</time>${q.contract?`<button data-c="${q.contract}">C${q.contract} →</button>`:''}</div></article>`;}).join('')+(qs.length?'':'<p class="small muted">No instructions yet. Choose an offer or tell your agent what to sell.</p>'):'';
    $('mine').innerHTML=(ACC?.trades||[]).map(c=>tradeRow(c,true)).join('')||'<p class="small muted">No completed trades yet.</p>';
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>openContract(+b.dataset.c).catch(showError));
    chatBox($('chat'),ACC||{chat:[]});renderAgents();$('banner').hidden=true;
  } catch(err) {showError(err);} finally {refreshing=false;}
}
$('agentBtn').onclick=()=>{if(!canAct())return;$('agents').hidden=!$('agents').hidden;$('agentBtn').setAttribute('aria-expanded',String(!$('agents').hidden));};
function renderAgents() {
  if (!ACC) return;
  if (document.activeElement && $("agents").contains(document.activeElement)) return;   // don't redraw under the cursor
  const a = ACC.account, s = a.sell_agent, b = a.buy_agent;
  $("agents").innerHTML = `<p class="small muted">Negotiation model: ${esc(META.model)} · ${esc(META.asset)} on ${esc(META.ledger)}. Provider configuration is managed by the service.</p><div class="card"><h3>Sell agent</h3>
    <label class="small" for="mode">Before selling</label><select id="mode"><option value="ask" ${s.mode === "ask" ? "selected" : ""}>Ask me first (or when I mark interest)</option><option value="auto" ${s.mode === "auto" ? "selected" : ""}>Sell on its own within my rules</option></select>
    <span class="small muted">Minimum per purchase (${esc(sym())})</span>
    ${Object.entries(META.kinds).map(([k, v]) => `<div class="row small"><label for="min-${k}">${esc(v.label)}</label><input type="number" step="any" min="0" id="min-${k}" value="${Number(((s.min?.[k] ?? v.price)*(META.unit_xrp||.01)).toFixed(6))}"></div>`).join("")}
    <label class="small" for="blocks">Never sell for (comma separated)</label><input type="text" id="blocks" value="${esc((s.blocks || []).join(", "))}"></div>
    <div class="card"><h3>Buy agent</h3>
    <div class="row small"><label for="limit">Buys on its own up to (${esc(sym())})</label><input type="number" min="0" step="any" id="limit" value="${Number((b.auto_limit*(META.unit_xrp||.01)).toFixed(6))}"></div>
    <div class="row small"><label for="trust">Minimum seller trust</label><input type="number" step="0.05" id="trust" value="${b.min_trust}"></div>
    <p class="small muted">Already-owned records are always blocked before payment, including inside resale bundles.</p></div>
    <button class="primary" type="button" id="save">Save agent settings</button><span class="small muted" id="saved"></span>`;
  $("save").onclick = async () => { try {
    if (!canAct()) return;
    const min = {}; Object.keys(META.kinds).forEach((k) => (min[k] = +$("min-" + k).value/(META.unit_xrp||.01)));
    await post(`/api/account/${ME}/settings`, { sell_agent: { mode: $("mode").value, min, blocks: $("blocks").value.split(",").map((x) => x.trim()).filter(Boolean) },
      buy_agent: { auto_limit: +$("limit").value/(META.unit_xrp||.01), min_trust: +$("trust").value } });
    $("saved").textContent = "Saved. Your agents use these from the next negotiation.";
  } catch(err) {showError(err);} };
}

async function openContract(id, updating=false) {
  if(detailBusy)return;detailBusy=true;
  try {
  const opened=updating?[...$('dlgBody').querySelectorAll('details')].map(e=>e.open):[],scroll=$('dlgBody').scrollTop;
  const d=await api(`/api/contract/${id}`), c=d.contract, t=c.trace||{}, asset=c.asset||'XRP';
  const finishes=d.txs.filter(x=>x.type.startsWith('EscrowFinish')&&x.result==='tesSUCCESS');
  const total=finishes.reduce((sum,x)=>sum+(x.drops||0),0);
  const model=[...new Set(d.messages.map(m=>m.by).filter(x=>x&&x!=='rules'))];
  const price=(units)=>micro(units*(c.unit_micro||10000),asset);
  const overview=c.overview;
  $('dlgBody').innerHTML=`<header class="contract-head"><div><span class="eyebrow">${esc(c.reference||`C${c.id}`)} · ${esc(META.kinds[c.kind].label)}</span><h1>${esc(META.kinds[c.kind].label)}</h1><p class="muted small">${esc(d.posting?.purpose||'')}</p><code class="small muted">${esc(c.ledger_memo||`vaultmarket/contract/${c.id}`)}</code></div><button id="close" aria-label="Close contract">Close</button></header>
  <div class="settlement-summary"><span class="tag ${c.status==='settled'?'green':''}">${esc(stateLabel(c.status))}</span><strong class="${c.status==='settled'?'success':''}">${total?micro(total,asset):'No verified payout'}</strong><span class="small muted">${finishes.length} verified payout${finishes.length===1?'':'s'} · ${model.length?esc(model.join(', ')):'Rule-based negotiation'}</span></div>
  ${c.status!=='settled'?`<p class="notice">${esc(c.reason||stateLabel(c.status))}</p>`:''}
  ${c.unit_micro!==1000000?`<p class="small muted">Original log uses price units: 1 unit = ${micro(c.unit_micro||10000,asset)}. Verified payouts below use the actual asset amount.</p>`:''}
  ${c.sellers.length>1?'<p class="small muted">This historical contract grouped several sellers. New contracts negotiate and settle with one seller at a time.</p>':''}
  <section class="data-overview"><h2>Data overview</h2><p class="overview-description">${esc({gps_track:'Running routes, distance, pace and heart rate.',sleep_log:'Sleep duration, stages, resting heart rate and HRV.',purchase_receipts:'Purchase dates, items, quantities and prices.',audio:'Voice clip duration, language and recording quality.',air:'Time series of PM2.5, nitrogen dioxide and ozone.'}[c.kind])}</p><div class="overview-grid"><div><span>Files / records</span><b>${overview?`${overview.files} files · ${overview.records} records`:`${c.items||'—'} files · original summary unavailable`}</b></div><div><span>Period</span><b>${overview?.start?`${esc(overview.start)}${overview.end!==overview.start?` → ${esc(overview.end)}`:''}`:'Not recorded'}</b></div><div><span>Purpose</span><b>${esc(d.posting?.purpose||'Not recorded')}</b></div><div><span>Agreed price</span><b>${c.total!=null?price(c.total):'No agreement'}</b></div></div>${overview?.fields?.length?`<p class="small muted">Included fields: ${overview.fields.filter(f=>!['points','nights','receipts','lines','clips','readings','trimmed'].includes(f)).map(f=>esc(({avg_pace_min_km:"Average pace",distance_km:"Distance",total_h:"Sleep duration",deep_h:"Deep sleep",rem_h:"REM sleep",light_h:"Light sleep",rhr:"Resting heart rate",hrv_ms:"HRV",lat:"Latitude",lng:"Longitude",hr:"Heart rate",pm25:"PM2.5",no2_ppb:"Nitrogen dioxide",o3_ppb:"Ozone",snr_db:"Recording quality"})[f]||f.replaceAll("_"," "))).join(", ")}</p>`:''}</section>
  <details class="conversation" open><summary>Negotiation · ${d.messages.length} messages</summary><div class="participants small muted">Buyer: ${esc(c.buyer_name)} · Seller: ${esc(c.seller_name|| (c.sellers.length>1?'Historical group':'Not selected'))}</div><div class="talk">${d.messages.map(m=>`<article class="say ${m.side}"><span class="who">${esc(m.name)} · ${m.side==='buyer'?'Buyer':'Seller'} · ${m.by&&m.by!=='rules'?esc(m.by):'Rules'}</span><div class="bubble">${esc(m.text)}</div>${m.thinking?`<details open><summary>Reason</summary><p>${esc(m.thinking)}</p></details>`:''}</article>`).join('')||'<p class="small muted">No negotiation messages were stored.</p>'}</div></details>
  <details class="audit"><summary>Decision details</summary><p class="small muted">Buyer opening ${price(d.posting?.offer||0)} · maximum ${price(d.posting?.max||0)}</p><ol>${(t.buyer_trace||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${(t.seller_trace||[]).map(x=>`<p class="small">${esc(d.messages.find(m=>m.speaker===x.seller)?.name||x.seller)} · ${x.verdict==='agree'?'Accepted terms':x.verdict==='decline'?'No sale: price or purpose did not fit':esc(x.verdict)}${x.price?` · asked ${price(x.price)}`:''}</p>`).join('')}</details>
  <details class="audit" ${c.status==='interrupted'||c.status==='recovery review'?'open':''}><summary>Ledger receipts & delivery checks</summary><p class="small muted">Amounts below are the gross transfer. Network fees are separate.</p>${d.txs.map(x=>`<div class="receipt"><div><b>${esc(x.reference)} · ${esc(x.type)}</b><p class="small muted">${x.receipt?.destination?`Destination ${esc(x.receipt.destination)}`:`${esc(x.src_name)} · ${esc(x.dst_name)}`} · ${esc(x.result)}</p></div><span class="${x.type.startsWith('EscrowFinish')&&x.result==='tesSUCCESS'?'success':''}">${x.receipt?.gross_amount!=null?amount(x.receipt.gross_amount,x.asset||asset):x.receipt?(x.receipt.validated&&x.receipt.result!=='tesSUCCESS'?'No transfer':'Amount unverified'):micro(x.drops,x.asset||asset)}</span>${x.receipt?`<p class="small muted">Ledger ${x.receipt.ledger_index||"pending"} · ${x.receipt.validated?"validated":"unverified"} · network fee ${x.receipt.fee_xrp} XRP</p>`:""}${x.url?`<a class="small mono" href="${x.url}" target="_blank" rel="noopener">${esc(x.hash)} ↗</a>`:''}</div>`).join('')}${(t.protocol||[]).map(x=>`<p class="small"><b>${esc(x.protocol)}</b> · ${x.ok?'Verified':'Not verified'}<br><span class="muted">${esc(x.detail)}</span></p>`).join('')}</details>`;
  currentContract=['negotiating','settling','awaiting buyer'].includes(c.status)?id:null;
  if(updating){$('dlgBody').querySelectorAll('details').forEach((e,i)=>e.open=opened[i]||false);$('dlgBody').scrollTop=scroll;}
  $('close').onclick=()=>{$('dlg').close();currentContract=null;};if(!$('dlg').open)$('dlg').showModal();
  } finally {detailBusy=false;}
}
setInterval(()=>{if(currentContract&&$('dlg').open&&!document.hidden)openContract(currentContract,true).catch(showError);},3000);
topbar('market').then(async()=>{await refresh();const id=Number(new URLSearchParams(location.search).get('contract'));if(Number.isInteger(id)&&id>0)await openContract(id);}).catch(showError);live();
</script></body></html>
